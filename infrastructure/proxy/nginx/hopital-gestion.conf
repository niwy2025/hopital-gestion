# À installer sur l'hôte dans /etc/nginx/sites-available/hopital-gestion.
# Remplacez les deux domaines d'exemple avant l'activation. L'API Gateway et
# le portail sont liés uniquement à 127.0.0.1 par Docker Compose.
server {
    listen 80;
    listen [::]:80;
    server_name api-hopital.exemple.cd;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name gestion.exemple.cd;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3140;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
