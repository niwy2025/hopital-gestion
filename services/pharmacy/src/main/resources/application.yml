server:
  port: 8089

spring:
  application:
    name: pharmacy-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/hospital_pharmacy}
    username: ${SPRING_DATASOURCE_USERNAME:hospital}
    password: ${SPRING_DATASOURCE_PASSWORD:hospital_password}
  flyway:
    locations: classpath:db/migration
    sql-migration-separator: _
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/hospital}

hospital:
  auth-service:
    base-url: ${AUTH_SERVICE_BASE_URL:http://auth-service:8081}
  organization-service:
    base-url: ${ORGANIZATION_SERVICE_BASE_URL:http://organization-service:8084}
  accounting-service:
    base-url: ${ACCOUNTING_SERVICE_BASE_URL:http://accounting-service:8090}
    # La réception de stock n'attend jamais la comptabilité : une file durable
    # réessaie avec ces délais réseau bornés.
    connect-timeout-ms: ${ACCOUNTING_OUTBOX_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ACCOUNTING_OUTBOX_READ_TIMEOUT_MS:5000}
    outbox:
      retry-delay-ms: ${ACCOUNTING_OUTBOX_RETRY_DELAY_MS:30000}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
