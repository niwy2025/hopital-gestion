# Surcharge de production. Elle s'utilise toujours avec docker-compose.yml :
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Les ports applicatifs sont volontairement retirés. Seul l'API Gateway est
# lié à la boucle locale, pour être joint par le Nginx installé sur l'hôte.
# Les communications inter-services restent internes.
services:
  kong:
    ports: !reset []
    restart: unless-stopped

  keycloak:
    ports: !reset []
    restart: unless-stopped

  sqlserver:
    ports: !reset []
    restart: unless-stopped

  kafka:
    ports: !reset []
    restart: unless-stopped

  api-gateway:
    ports: !override ["127.0.0.1:${HOSPITAL_API_GATEWAY_PORT:-8888}:8088"]
    restart: unless-stopped

  auth-service:
    ports: !reset []
    restart: unless-stopped

  account-service:
    ports: !reset []
    restart: unless-stopped

  notification-service:
    ports: !reset []
    restart: unless-stopped

  organization-service:
    ports: !reset []
    restart: unless-stopped

  laboratory-service:
    ports: !reset []
    restart: unless-stopped

  patient-service:
    ports: !reset []
    restart: unless-stopped

  prometheus:
    ports: !override ["${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"]
    restart: unless-stopped

  grafana:
    ports: !override ["${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_HOST_PORT:-3000}:3000"]
    restart: unless-stopped

  zookeeper:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  kong-database:
    restart: unless-stopped

  keycloak-database:
    restart: unless-stopped

  kong-migrations:
    restart: on-failure

  kong-init:
    restart: on-failure

  sqlserver-init:
    restart: on-failure

  keycloak-init:
    restart: on-failure
