server:
  port: 8085

spring:
  application:
    name: laboratory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/hospital_laboratory}
    username: ${SPRING_DATASOURCE_USERNAME:hospital}
    password: ${SPRING_DATASOURCE_PASSWORD:hospital_password}
  flyway:
    locations: classpath:db/migration
    sql-migration-separator: _
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/hospital}

hospital:
  auth-service:
    base-url: ${AUTH_SERVICE_BASE_URL:http://auth-service:8081}
  organization-service:
    base-url: ${ORGANIZATION_SERVICE_BASE_URL:http://organization-service:8084}
  patient-service:
    base-url: ${PATIENT_SERVICE_BASE_URL:http://patient-service:8086}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
