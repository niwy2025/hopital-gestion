server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: patient-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/hospital_patient}
    username: ${SPRING_DATASOURCE_USERNAME:hospital}
    password: ${SPRING_DATASOURCE_PASSWORD:hospital_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    sql-migration-separator: _
    validate-migration-naming: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/hospital}

hospital:
  auth-service:
    base-url: ${AUTH_SERVICE_BASE_URL:http://auth-service:8081}
  organization-service:
    base-url: ${ORGANIZATION_SERVICE_BASE_URL:http://organization-service:8084}
  personnel-service:
    base-url: ${PERSONNEL_SERVICE_BASE_URL:http://personnel-service:8087}
  pharmacy-service:
    base-url: ${PHARMACY_SERVICE_BASE_URL:http://pharmacy-service:8089}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
