server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://sqlserver:1433;databaseName=hospital_auth;encrypt=false;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:Your_strong_Password123!}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
  flyway:
    locations: classpath:db/migration
    sql-migration-separator: _
    validate-migration-naming: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/hospital}

hospital:
  notification:
    topic: ${NOTIFICATION_TOPIC:hospital.notification.request.v1}
  auth:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/hospital}
    keycloak-base-url: ${KEYCLOAK_BASE_URL:http://keycloak:8080}
    keycloak-realm: ${KEYCLOAK_REALM:hospital}
    keycloak-client-id: ${KEYCLOAK_CLIENT_ID:hospital-services}
    keycloak-client-secret: ${KEYCLOAK_CLIENT_SECRET:change-me-in-production}
    personnel-service-base-url: ${PERSONNEL_SERVICE_BASE_URL:http://personnel-service:8087}
    organization-service-base-url: ${ORGANIZATION_SERVICE_BASE_URL:http://organization-service:8084}
  account-service:
    base-url: ${ACCOUNT_SERVICE_BASE_URL:http://account-service:8082}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
