server:
  port: 8084

spring:
  application:
    name: organization-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/hospital_organization}
    username: ${SPRING_DATASOURCE_USERNAME:hospital}
    password: ${SPRING_DATASOURCE_PASSWORD:hospital_password}
  flyway:
    locations: classpath:db/migration
    sql-migration-separator: _
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/hospital}

hospital:
  auth-service:
    base-url: ${AUTH_SERVICE_BASE_URL:http://auth-service:8081}
  patient-service:
    base-url: ${PATIENT_SERVICE_BASE_URL:http://patient-service:8086}
  personnel-service:
    base-url: ${PERSONNEL_SERVICE_BASE_URL:http://personnel-service:8087}
  accounting-service:
    base-url: ${ACCOUNTING_SERVICE_BASE_URL:http://accounting-service:8090}
  patrimony:
    accounting-delay-ms: ${PATRIMONY_ACCOUNTING_DELAY_MS:30000}
    beds-delay-ms: ${PATRIMONY_BEDS_DELAY_MS:60000}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
