name: ${COMPOSE_PROJECT_NAME:-hopital-gestion}

x-container-logging: &container-logging
  # Sans rotation, les logs JSON de Docker peuvent remplir le disque du VPS.
  # Le pilote local est compressé et plus économe que le pilote json-file par défaut.
  logging:
    driver: local
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
      max-file: ${DOCKER_LOG_MAX_FILES:-3}

x-spring-service: &spring-service
  <<: *container-logging
  restart: unless-stopped
  # Une JVM sans limite voit toute la RAM de Docker et peut réserver un heap
  # disproportionné. Ces plafonds restent modifiables dans .env.
  mem_limit: ${SPRING_SERVICE_MEMORY_LIMIT:-512m}
  mem_reservation: ${SPRING_SERVICE_MEMORY_RESERVATION:-256m}
  memswap_limit: ${SPRING_SERVICE_MEMORY_LIMIT:-512m}
  pids_limit: ${SPRING_SERVICE_PIDS_LIMIT:-160}

x-spring-jvm: &spring-jvm
  JAVA_TOOL_OPTIONS: ${SPRING_JAVA_TOOL_OPTIONS:--Xms96m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=64m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}

services:
  # Une seule instance PostgreSQL, avec une base logique par microservice.
  # Les rôles Keycloak/Kong sont séparés ; les services métier conservent leurs
  # propres bases (hospital_account, hospital_auth, etc.).
  postgres:
    <<: *container-logging
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-256m}
    memswap_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-160}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      HOSPITAL_DB_USER: ${HOSPITAL_DB_USER:-hospital}
      HOSPITAL_DB_PASSWORD: ${HOSPITAL_DB_PASSWORD:-hospital_password}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgresql/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    ports:
      - "${POSTGRES_HOST_PORT:-54320}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hospital-network]

  pharmacy-db-init:
    <<: *container-logging
    image: postgres:16-alpine
    container_name: pharmacy-db-init
    command: ["bash", "/scripts/ensure-pharmacy-database.sh"]
    environment:
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      HOSPITAL_DB_USER: ${HOSPITAL_DB_USER:-hospital}
    volumes:
      - ./infrastructure/docker/postgresql/ensure-pharmacy-database.sh:/scripts/ensure-pharmacy-database.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [hospital-network]

  # Même sur un volume PostgreSQL déjà existant, la base du nouveau module est
  # créée avant que Flyway du service Comptabilité ne démarre.
  accounting-db-init:
    <<: *container-logging
    image: postgres:16-alpine
    container_name: accounting-db-init
    command: ["bash", "/scripts/ensure-accounting-database.sh"]
    environment:
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      HOSPITAL_DB_USER: ${HOSPITAL_DB_USER:-hospital}
    volumes:
      - ./infrastructure/docker/postgresql/ensure-accounting-database.sh:/scripts/ensure-accounting-database.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [hospital-network]

  kong-migrations:
    <<: *container-logging
    image: kong:3.7
    container_name: kong-migrations
    command: kong migrations bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment: &kong-env
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong_password}
    networks: [hospital-network]
    restart: on-failure

  kong:
    <<: *container-logging
    image: kong:3.7
    container_name: kong
    restart: unless-stopped
    mem_limit: ${KONG_MEMORY_LIMIT:-384m}
    mem_reservation: ${KONG_MEMORY_RESERVATION:-128m}
    memswap_limit: ${KONG_MEMORY_LIMIT:-384m}
    pids_limit: ${KONG_PIDS_LIMIT:-120}
    stop_grace_period: 30s
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
      api-gateway:
        condition: service_started
    environment:
      <<: *kong-env
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # `auto` crée un worker par cœur CPU. Un seul worker suffit ici et évite
      # que Kong dépasse sa limite mémoire lors des démarrages locaux.
      KONG_NGINX_WORKER_PROCESSES: "1"
    networks: [hospital-network]
    healthcheck:
      test: ["CMD-SHELL", "kong health >/dev/null 2>&1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

  kong-init:
    <<: *container-logging
    image: curlimages/curl:8.8.0
    container_name: kong-init
    depends_on:
      - kong
    command: >
      sh -c "
      until curl -sf http://kong:8001/status; do sleep 2; done;
      curl -sf -X PUT http://kong:8001/services/api-gateway --data url=http://api-gateway:8088;
      curl -sf -X PUT http://kong:8001/services/api-gateway/routes/hospital-api --data 'paths[]=/api/v1' --data strip_path=false;
      curl -sf -X PUT http://kong:8001/services/api-gateway/routes/gateway-ready --data 'paths[]=/gateway' --data strip_path=false;
      if ! curl -sf http://kong:8001/routes/hospital-api/plugins | grep -q '"name":"cors"'; then
        curl -sf -X POST http://kong:8001/routes/hospital-api/plugins --data name=cors --data 'config.origins[]=http://localhost:3001' --data 'config.methods[]=GET' --data 'config.methods[]=POST' --data 'config.methods[]=PUT' --data 'config.methods[]=PATCH' --data 'config.methods[]=DELETE' --data 'config.methods[]=OPTIONS' --data 'config.headers[]=Accept' --data 'config.headers[]=Authorization' --data 'config.headers[]=Content-Type' --data config.credentials=true --data config.max_age=3600;
      fi;
      "
    networks: [hospital-network]

  keycloak:
    <<: *container-logging
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-1g}
    mem_reservation: ${KEYCLOAK_MEMORY_RESERVATION:-512m}
    memswap_limit: ${KEYCLOAK_MEMORY_LIMIT:-1g}
    pids_limit: ${KEYCLOAK_PIDS_LIMIT:-180}
    stop_grace_period: 1m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      # Keycloak utilise sinon jusqu'à 70 % de la mémoire Docker disponible.
      JAVA_OPTS_KC_HEAP: ${KEYCLOAK_JAVA_OPTS_KC_HEAP:--XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=55 -XX:MaxHeapFreeRatio=50}
    volumes:
      - ./infrastructure/keycloak/hospital-realm.json:/opt/keycloak/data/import/hospital-realm.json:ro
    networks: [hospital-network]
    healthcheck:
      test:
        ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  keycloak-init:
    <<: *container-logging
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until /opt/keycloak/bin/kcadm.sh config credentials \
          --server http://keycloak:8080 \
          --realm master \
          --user "$${KEYCLOAK_ADMIN}" \
          --password "$${KEYCLOAK_ADMIN_PASSWORD}"; do
          sleep 2
        done
        /opt/keycloak/bin/kcadm.sh update realms/hospital \
          -s accessTokenLifespan=900 \
          -s ssoSessionIdleTimeout=28800 \
          -s ssoSessionMaxLifespan=86400
        if ! /opt/keycloak/bin/kcadm.sh get roles/HR_MANAGER -r hospital >/dev/null 2>&1; then
          /opt/keycloak/bin/kcadm.sh create roles -r hospital -s name=HR_MANAGER -s 'description=Personnel management'
        fi
        if ! /opt/keycloak/bin/kcadm.sh get roles/PHARMACIST -r hospital >/dev/null 2>&1; then
          /opt/keycloak/bin/kcadm.sh create roles -r hospital -s name=PHARMACIST -s 'description=Pharmacist'
        fi
        if ! /opt/keycloak/bin/kcadm.sh get roles/HOSPITAL_ADMIN -r hospital >/dev/null 2>&1; then
          /opt/keycloak/bin/kcadm.sh create roles -r hospital -s name=HOSPITAL_ADMIN -s 'description=Hospital administrator'
        fi
        if ! /opt/keycloak/bin/kcadm.sh get roles/PHARMACY_ADMIN -r hospital >/dev/null 2>&1; then
          /opt/keycloak/bin/kcadm.sh create roles -r hospital -s name=PHARMACY_ADMIN -s 'description=Hospital pharmacy administrator'
        fi
        if ! /opt/keycloak/bin/kcadm.sh get roles/LABORATORY_TECHNICIAN -r hospital >/dev/null 2>&1; then
          /opt/keycloak/bin/kcadm.sh create roles -r hospital -s name=LABORATORY_TECHNICIAN -s 'description=Laboratory technician'
        fi
        if ! /opt/keycloak/bin/kcadm.sh get roles/LABORATORY_BIOLOGIST -r hospital >/dev/null 2>&1; then
          /opt/keycloak/bin/kcadm.sh create roles -r hospital -s name=LABORATORY_BIOLOGIST -s 'description=Medical biologist'
        fi
        if ! /opt/keycloak/bin/kcadm.sh get roles/BILLING_OFFICER -r hospital >/dev/null 2>&1; then
          /opt/keycloak/bin/kcadm.sh create roles -r hospital -s name=BILLING_OFFICER -s 'description=Hospital billing officer'
        fi
        if ! /opt/keycloak/bin/kcadm.sh get roles/CASHIER -r hospital >/dev/null 2>&1; then
          /opt/keycloak/bin/kcadm.sh create roles -r hospital -s name=CASHIER -s 'description=Hospital cashier'
        fi
        if ! /opt/keycloak/bin/kcadm.sh get roles/HOSPITAL_ACCOUNTANT -r hospital >/dev/null 2>&1; then
          /opt/keycloak/bin/kcadm.sh create roles -r hospital -s name=HOSPITAL_ACCOUNTANT -s 'description=Hospital accountant'
        fi
        if ! /opt/keycloak/bin/kcadm.sh get roles/FINANCE_MANAGER -r hospital >/dev/null 2>&1; then
          /opt/keycloak/bin/kcadm.sh create roles -r hospital -s name=FINANCE_MANAGER -s 'description=Hospital finance manager'
        fi
        if ! /opt/keycloak/bin/kcadm.sh get roles/FINANCE_AUDITOR -r hospital >/dev/null 2>&1; then
          /opt/keycloak/bin/kcadm.sh create roles -r hospital -s name=FINANCE_AUDITOR -s 'description=Hospital finance auditor'
        fi
        client_id=$$(/opt/keycloak/bin/kcadm.sh get clients -r hospital -q clientId=hospital-services --fields id --format csv | tr -d '\"\r\n')
        /opt/keycloak/bin/kcadm.sh update clients/$$client_id -r hospital \
          -s directAccessGrantsEnabled=true \
          -s "secret=$${KEYCLOAK_CLIENT_SECRET}"
        service_account_id=$$(/opt/keycloak/bin/kcadm.sh get clients/$$client_id/service-account-user -r hospital --fields id --format csv | tr -d '\"\r\n')
        /opt/keycloak/bin/kcadm.sh add-roles -r hospital --uid $$service_account_id --cclientid realm-management \
          --rolename manage-users --rolename query-users --rolename view-users --rolename view-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me-in-production}
    networks: [hospital-network]
    restart: on-failure

  zookeeper:
    <<: *container-logging
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    mem_limit: ${ZOOKEEPER_MEMORY_LIMIT:-384m}
    mem_reservation: ${ZOOKEEPER_MEMORY_RESERVATION:-128m}
    memswap_limit: ${ZOOKEEPER_MEMORY_LIMIT:-384m}
    pids_limit: ${ZOOKEEPER_PIDS_LIMIT:-120}
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: ${ZOOKEEPER_HEAP_OPTS:--Xms128m -Xmx192m}
    networks: [hospital-network]
    healthcheck:
      # Une sonde TCP évite de démarrer un client Java supplémentaire à chaque
      # vérification, ce qui surcharge inutilement une petite machine.
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 15s

  kafka:
    <<: *container-logging
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${KAFKA_MEMORY_LIMIT:-768m}
    mem_reservation: ${KAFKA_MEMORY_RESERVATION:-256m}
    memswap_limit: ${KAFKA_MEMORY_LIMIT:-768m}
    pids_limit: ${KAFKA_PIDS_LIMIT:-160}
    stop_grace_period: 45s
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx384m}
    networks: [hospital-network]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  redis:
    <<: *container-logging
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-192m}
    mem_reservation: ${REDIS_MEMORY_RESERVATION:-64m}
    memswap_limit: ${REDIS_MEMORY_LIMIT:-192m}
    pids_limit: ${REDIS_PIDS_LIMIT:-80}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [hospital-network]

  api-gateway:
    <<: *spring-service
    image: api-gateway
    build:
      context: .
      dockerfile: infrastructure/gateway/api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      <<: *spring-jvm
      AUTH_SERVICE_URI: http://auth-service:8081
      ACCOUNT_SERVICE_URI: http://account-service:8082
      NOTIFICATION_SERVICE_URI: http://notification-service:8083
      ORGANIZATION_SERVICE_URI: http://organization-service:8084
      LABORATORY_SERVICE_URI: http://laboratory-service:8085
      PATIENT_SERVICE_URI: http://patient-service:8086
      PHARMACY_SERVICE_URI: http://pharmacy-service:8089
      PERSONNEL_SERVICE_URI: http://personnel-service:8087
      ACCOUNTING_SERVICE_URI: http://accounting-service:8090
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - redis
      - auth-service
      - notification-service
      - organization-service
      - laboratory-service
      - patient-service
      - pharmacy-service
      - personnel-service
      - accounting-service
    ports:
      - "${HOSPITAL_API_GATEWAY_PORT:-8888}:8088"
    networks: [hospital-network]

  auth-service:
    <<: *spring-service
    image: auth-service
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth-service
    environment:
      <<: *spring-jvm
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hospital_auth
      SPRING_DATASOURCE_USERNAME: ${HOSPITAL_DB_USER:-hospital}
      SPRING_DATASOURCE_PASSWORD: ${HOSPITAL_DB_PASSWORD:-hospital_password}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATION_TOPIC: hospital.notification.request.v1
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/hospital
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: hospital
      KEYCLOAK_CLIENT_ID: hospital-services
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
      keycloak-init:
        condition: service_completed_successfully
    networks: [hospital-network]

  account-service:
    <<: *spring-service
    image: account-service
    build:
      context: .
      dockerfile: services/account/Dockerfile
    container_name: account-service
    environment:
      <<: *spring-jvm
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hospital_account
      SPRING_DATASOURCE_USERNAME: ${HOSPITAL_DB_USER:-hospital}
      SPRING_DATASOURCE_PASSWORD: ${HOSPITAL_DB_PASSWORD:-hospital_password}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HOSPITAL_ADMIN_USERNAME: ${HOSPITAL_ADMIN_USERNAME:-admin}
      HOSPITAL_ADMIN_EMAIL: ${HOSPITAL_ADMIN_EMAIL:-admin@hopital.local}
      HOSPITAL_ADMIN_PASSWORD: ${HOSPITAL_ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    networks: [hospital-network]

  notification-service:
    <<: *spring-service
    image: notification-service
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: notification-service
    environment:
      <<: *spring-jvm
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATION_TOPIC: hospital.notification.request.v1
    depends_on:
      kafka:
        condition: service_healthy
    networks: [hospital-network]

  organization-service:
    <<: *spring-service
    image: organization-service
    build:
      context: .
      dockerfile: services/organization/Dockerfile
    container_name: organization-service
    environment:
      <<: *spring-jvm
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hospital_organization
      SPRING_DATASOURCE_USERNAME: ${HOSPITAL_DB_USER:-hospital}
      SPRING_DATASOURCE_PASSWORD: ${HOSPITAL_DB_PASSWORD:-hospital_password}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [hospital-network]

  laboratory-service:
    <<: *spring-service
    image: laboratory-service
    build:
      context: .
      dockerfile: services/laboratory/Dockerfile
    container_name: laboratory-service
    environment:
      <<: *spring-jvm
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hospital_laboratory
      SPRING_DATASOURCE_USERNAME: ${HOSPITAL_DB_USER:-hospital}
      SPRING_DATASOURCE_PASSWORD: ${HOSPITAL_DB_PASSWORD:-hospital_password}
      ORGANIZATION_SERVICE_BASE_URL: http://organization-service:8084
      PATIENT_SERVICE_BASE_URL: http://patient-service:8086
    depends_on:
      postgres:
        condition: service_healthy
    networks: [hospital-network]

  patient-service:
    <<: *spring-service
    image: patient-service
    build:
      context: .
      dockerfile: services/patient/Dockerfile
    container_name: patient-service
    environment:
      <<: *spring-jvm
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hospital_patient
      SPRING_DATASOURCE_USERNAME: ${HOSPITAL_DB_USER:-hospital}
      SPRING_DATASOURCE_PASSWORD: ${HOSPITAL_DB_PASSWORD:-hospital_password}
      PERSONNEL_SERVICE_BASE_URL: http://personnel-service:8087
      PHARMACY_SERVICE_BASE_URL: http://pharmacy-service:8089
      ACCOUNTING_SERVICE_BASE_URL: ${ACCOUNTING_SERVICE_BASE_URL:-http://accounting-service:8090}
      ACCOUNTING_OUTBOX_CONNECT_TIMEOUT_MS: ${ACCOUNTING_OUTBOX_CONNECT_TIMEOUT_MS:-2000}
      ACCOUNTING_OUTBOX_READ_TIMEOUT_MS: ${ACCOUNTING_OUTBOX_READ_TIMEOUT_MS:-5000}
      ACCOUNTING_OUTBOX_RETRY_DELAY_MS: ${ACCOUNTING_OUTBOX_RETRY_DELAY_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      organization-service:
        condition: service_started
      personnel-service:
        condition: service_started
      pharmacy-service:
        condition: service_started
    networks: [hospital-network]

  pharmacy-service:
    <<: *spring-service
    image: pharmacy-service
    build:
      context: .
      dockerfile: services/pharmacy/Dockerfile
    container_name: pharmacy-service
    environment:
      <<: *spring-jvm
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hospital_pharmacy
      SPRING_DATASOURCE_USERNAME: ${HOSPITAL_DB_USER:-hospital}
      SPRING_DATASOURCE_PASSWORD: ${HOSPITAL_DB_PASSWORD:-hospital_password}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      ORGANIZATION_SERVICE_BASE_URL: http://organization-service:8084
      ACCOUNTING_SERVICE_BASE_URL: ${ACCOUNTING_SERVICE_BASE_URL:-http://accounting-service:8090}
      ACCOUNTING_OUTBOX_CONNECT_TIMEOUT_MS: ${ACCOUNTING_OUTBOX_CONNECT_TIMEOUT_MS:-2000}
      ACCOUNTING_OUTBOX_READ_TIMEOUT_MS: ${ACCOUNTING_OUTBOX_READ_TIMEOUT_MS:-5000}
      ACCOUNTING_OUTBOX_RETRY_DELAY_MS: ${ACCOUNTING_OUTBOX_RETRY_DELAY_MS:-30000}
    depends_on:
      pharmacy-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      organization-service:
        condition: service_started
    networks: [hospital-network]

  accounting-service:
    <<: *spring-service
    image: accounting-service
    build:
      context: .
      dockerfile: services/accounting/Dockerfile
    container_name: accounting-service
    environment:
      <<: *spring-jvm
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hospital_accounting
      SPRING_DATASOURCE_USERNAME: ${HOSPITAL_DB_USER:-hospital}
      SPRING_DATASOURCE_PASSWORD: ${HOSPITAL_DB_PASSWORD:-hospital_password}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      PATIENT_SERVICE_BASE_URL: http://patient-service:8086
      PHARMACY_SERVICE_BASE_URL: http://pharmacy-service:8089
    depends_on:
      accounting-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
      pharmacy-service:
        condition: service_started
    networks: [hospital-network]

  personnel-service:
    <<: *spring-service
    image: personnel-service
    build:
      context: .
      dockerfile: services/personnel/Dockerfile
    container_name: personnel-service
    environment:
      <<: *spring-jvm
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hospital_personnel
      SPRING_DATASOURCE_USERNAME: ${HOSPITAL_DB_USER:-hospital}
      SPRING_DATASOURCE_PASSWORD: ${HOSPITAL_DB_PASSWORD:-hospital_password}
      ACCOUNT_SERVICE_URI: http://account-service:8082
      ORGANIZATION_SERVICE_URI: http://organization-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_started
      organization-service:
        condition: service_started
    networks: [hospital-network]

  prometheus:
    <<: *container-logging
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-384m}
    mem_reservation: ${PROMETHEUS_MEMORY_RESERVATION:-128m}
    memswap_limit: ${PROMETHEUS_MEMORY_LIMIT:-384m}
    pids_limit: ${PROMETHEUS_PIDS_LIMIT:-100}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [hospital-network]

  grafana:
    <<: *container-logging
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-256m}
    mem_reservation: ${GRAFANA_MEMORY_RESERVATION:-96m}
    memswap_limit: ${GRAFANA_MEMORY_LIMIT:-256m}
    pids_limit: ${GRAFANA_PIDS_LIMIT:-100}
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [hospital-network]

networks:
  hospital-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
