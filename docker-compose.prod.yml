# Surcharge de production. Elle s'utilise toujours avec docker-compose.yml :
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Les ports applicatifs sont volontairement retirés. Seul l'API Gateway est
# lié à la boucle locale, pour être joint par le Nginx installé sur l'hôte.
# Les communications inter-services restent internes.
services:
  kong:
    ports: !reset []
    restart: unless-stopped

  keycloak:
    ports: !reset []
    restart: unless-stopped

  postgres:
    # Accès d'administration local uniquement. Utilisez un tunnel SSH pour
    # DBeaver ; PostgreSQL ne doit jamais être publié directement sur Internet.
    ports: !override ["127.0.0.1:${POSTGRES_HOST_PORT:-54320}:5432"]
    restart: unless-stopped

  kafka:
    ports: !reset []
    restart: unless-stopped

  api-gateway:
    ports: !override ["127.0.0.1:${HOSPITAL_API_GATEWAY_PORT:-8888}:8088"]
    restart: unless-stopped

  auth-service:
    ports: !reset []
    restart: unless-stopped

  account-service:
    environment:
      HOSPITAL_ADMIN_USERNAME: ${HOSPITAL_ADMIN_USERNAME:?Définissez HOSPITAL_ADMIN_USERNAME dans le fichier .env}
      HOSPITAL_ADMIN_EMAIL: ${HOSPITAL_ADMIN_EMAIL:?Définissez HOSPITAL_ADMIN_EMAIL dans le fichier .env}
      HOSPITAL_ADMIN_PASSWORD: ${HOSPITAL_ADMIN_PASSWORD:?Définissez HOSPITAL_ADMIN_PASSWORD dans le fichier .env}
    ports: !reset []
    restart: unless-stopped

  notification-service:
    ports: !reset []
    restart: unless-stopped

  organization-service:
    ports: !reset []
    restart: unless-stopped

  laboratory-service:
    ports: !reset []
    restart: unless-stopped

  patient-service:
    ports: !reset []
    restart: unless-stopped

  personnel-service:
    ports: !reset []
    restart: unless-stopped

  prometheus:
    ports: !override ["${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"]
    restart: unless-stopped

  grafana:
    ports: !override ["${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_HOST_PORT:-3000}:3000"]
    restart: unless-stopped

  zookeeper:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  kong-migrations:
    restart: on-failure

  kong-init:
    restart: on-failure

  keycloak-init:
    restart: on-failure
