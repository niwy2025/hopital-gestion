server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: personnel-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/hospital_personnel}
    username: ${SPRING_DATASOURCE_USERNAME:hospital}
    password: ${SPRING_DATASOURCE_PASSWORD:hospital_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    sql-migration-separator: _
    validate-migration-naming: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/hospital}

personnel:
  account-service-url: ${ACCOUNT_SERVICE_URI:http://account-service:8082}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
