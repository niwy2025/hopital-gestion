global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["kong:8001"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8088"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["account-service:8082"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8083"]

  - job_name: organization-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["organization-service:8084"]

  - job_name: laboratory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["laboratory-service:8085"]

  - job_name: patient-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["patient-service:8086"]

  - job_name: pharmacy-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pharmacy-service:8089"]

  - job_name: accounting-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["accounting-service:8090"]

  - job_name: personnel-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["personnel-service:8087"]
